<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Custom Price Range Slider">
        <meta http-equiv="X-UA-Compatible" content="IE=7">
        <title>
            Custom Price Range Slider--GFG
        </title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="main">
            <div class="gfg">
                <p>GeeksForGeeks</p>
            </div>
            <div class="custom-wrapper">
                <h2 class="projtitle">
                    Price Range Slider
                </h2>
            </div>

            <div class="price-input-container">
                <div class="price-input">
                    <div class="price-field">
                        <label for="min-price">Minimum Price</label>
                        <input id="min-price" type="number" title="Minimum Price" class="min-input" value="2500" aria-label="Minimum Price" autocomplete="off">
                    </div>

                    <div class="price-field">
                        <label for="max-price">Maximum Price</label>
                        <input id="max-price" type="number" title="Maximum Price" class="max-input" value="8500" aria-label="Maximum Price" autocomplete="off">
                    </div>
                </div>
                <div class="slider-container">
                    <div class="price-slider">

                    </div>
                </div>
            </div>

            <div class="range-input" role="group" aria-label="Price Range Slider">
                <input type="range"
                id="min-range"
                class="min-range"
                min="0"
                max="10000"
                value="2500"
                step="1"
                aria-label="Minimum Price Range">
                <input type="range"
                id="max-range"
                class="max-range"
                min="0"
                max="10000"
                value="8500"
                step="1"
                aria-label="Maximum Price Range">
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
